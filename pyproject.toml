[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaflet-rag"
version = "0.1.0"
description = "Retrieval-augmented question answering over medicine package leaflets, with citations, guardrails and evaluation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Oumayma El Moussaoui" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
    "pypdf>=4",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "joblib>=1.3",
    "openai>=1.30",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
ui = ["gradio>=4"]
embeddings = ["sentence-transformers>=2.6"]
tracking = ["mlflow>=2.12"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
