name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Unit and API tests
        run: pytest -q
      - name: Evaluation gate (fictional fixture leaflets, no LLM)
        env:
          LEAFLET_RAW_DIR: tests/fixtures
          LEAFLET_INDEX_DIR: /tmp/index
        run: |
          python -m leaflet_rag ingest
          python -m leaflet_rag eval \
            --questions tests/fixtures/eval_fixture.jsonl \
            --guardrails eval/guardrail_questions.jsonl \
            --out eval-results \
            --min-guardrail-accuracy 1.0
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: eval-report
          path: eval-results/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t leaflet-rag:ci .
      - name: Smoke test container
        run: |
          docker run -d --name app -p 8000:8000 -v "$PWD/tests/fixtures:/app/data/raw:ro" leaflet-rag:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question": "What are the side effects of Fictamol?"}' | grep -q '"status":"answered"'
          docker logs app
